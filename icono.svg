  <g>
    <circle cx="32" cy="32" r="19" fill="#8B3DFF"/>
    <rect x="11" y="24.5" width="42" height="3.4" fill="#0A0A0B"/>
    <rect x="11" y="31.2" width="42" height="5.2" fill="#0A0A0B"/>
    <rect x="11" y="40.0" width="42" height="2.4" fill="#0A0A0B"/>
    <circle cx="32" cy="32" r="2.6" fill="#0A0A0B"/>
  </g>
</svg>
