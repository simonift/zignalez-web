<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zignalez" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Isotipo: el nombre viene de 'señal'. Un circulo (el disco) cortado por
       franjas de grosor desigual: surco de vinilo, onda y senal interrumpida.
       Legible a 16px porque son cuatro formas y nada mas. -->
