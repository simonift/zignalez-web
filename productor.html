<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zignalez — Material compartido</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico">
<link rel="preload" href="assets/fuentes/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/space-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/zp-player.css">
<style>
@font-face{font-family:'Syne';font-weight:700 800;font-display:swap;src:url('assets/fuentes/syne-latin.woff2') format('woff2')}
@font-face{font-family:'Manrope';font-weight:400 800;font-display:swap;src:url('assets/fuentes/manrope-latin.woff2') format('woff2')}
@font-face{font-family:'Space Mono';font-weight:400;font-display:swap;src:url('assets/fuentes/space-mono-400-latin.woff2') format('woff2')}
@font-face{font-family:'Space Mono';font-weight:700;font-display:swap;src:url('assets/fuentes/space-mono-700-latin.woff2') format('woff2')}
:root{
  --ink:#0A0A0B; --ink-2:#111116; --ink-3:#17171d;
  --uv:#8B3DFF; --uv-soft:#A66BFF;
  --chrome:#C7CCD1; --chrome-hi:#E8EAED; --smoke:#8A86A0; --white:#FFFFFF;
  --line:rgba(199,204,209,.14); --line-2:rgba(199,204,209,.28); --amber:#D9A441;
  --font-d:'Syne',system-ui,sans-serif; --font-b:'Manrope',system-ui,sans-serif; --font-m:'Space Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-padding-bottom:var(--zp-h,0px)}
body{background:radial-gradient(70% 50% at 100% 0%,rgba(139,61,255,.14),transparent 60%),var(--ink);color:var(--chrome);
  font-family:var(--font-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
h1,h2{font-family:var(--font-d);font-weight:800;letter-spacing:-.01em;color:var(--chrome-hi);margin:0}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1}
.eyebrow{font-family:var(--font-m);font-size:11px;text-transform:uppercase;letter-spacing:.28em;color:var(--smoke);margin:0 0 10px}
.muted{color:var(--smoke)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
label{display:block;font-family:var(--font-m);font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--smoke);margin:0 0 6px}
input[type=email]{width:100%;background:#0d0d12;color:var(--chrome-hi);border:1px solid var(--line-2);border-radius:2px;padding:12px 12px;font-size:15px;font-family:var(--font-b)}
input:focus{outline:none;border-color:var(--uv);box-shadow:0 0 0 3px rgba(139,61,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-m);font-size:11px;text-transform:uppercase;
  letter-spacing:.16em;padding:11px 18px;border-radius:2px;cursor:pointer;background:transparent;color:var(--chrome-hi);border:1px solid var(--line-2);min-height:44px}
.btn:hover:not(:disabled){border-color:var(--uv);color:var(--white)}
.btn:focus-visible{outline:2px solid var(--uv-soft);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--uv);border-color:var(--uv);color:var(--white)}
.btn.sm{padding:7px 12px;font-size:10px;min-height:36px}
.status{font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;padding:10px 12px;border-radius:2px;border:1px solid var(--line);color:var(--smoke);margin-top:14px}
.status.hidden{display:none}
.status.ok{border-color:rgba(139,61,255,.45);color:var(--uv-soft)}
.status.err{border-color:rgba(217,164,65,.45);color:var(--amber)}
.screen{display:none}.screen.active{display:block}

/* cabecera */
.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--line)}
.who{font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);word-break:break-all;text-align:right}
.resumen{font-family:var(--font-m);font-size:11.5px;letter-spacing:.08em;color:var(--smoke);margin:14px 0 0}

/* dos columnas como socios: disco a la izquierda, lista a la derecha */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
.col-zp{min-width:0}
.col-lista{min-width:0}
@media (min-width:980px){
  .cols{grid-template-columns:448px minmax(0,1fr);gap:36px}
  .col-zp{position:sticky;top:20px}
}
/* móvil: el reproductor pegado abajo */
@media (max-width:979px){
  .cols{display:flex;flex-direction:column}
  .col-lista{order:1}
  .col-zp{order:2;position:sticky;bottom:0;z-index:20;margin:0 -20px;padding:0 12px 8px;
    background:linear-gradient(to bottom,rgba(10,10,11,0),var(--ink) 24%)}
  .col-zp .zp{box-shadow:0 -12px 32px rgba(0,0,0,.5)}
}

/* tarjetas */
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;min-height:72px;
  border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--ink-2),var(--ink));color:inherit;cursor:pointer;
  transition:border-color .18s ease,transform .18s ease;font:inherit}
.item:hover:not(:disabled){border-color:var(--uv);transform:translateY(-1px)}
.item:focus-visible{outline:2px solid var(--uv-soft);outline-offset:2px}
.item:disabled{opacity:.5;cursor:default}
.item.on{border-color:rgba(255,214,128,.5);background:linear-gradient(180deg,rgba(255,214,128,.06),var(--ink))}
.item.cargando{border-color:var(--line-2)}
.item-ico{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  border:1px solid var(--line-2);background:rgba(139,61,255,.12);color:var(--uv-soft);transition:background .15s,color .15s,border-color .15s}
.item-ico svg{width:14px;height:14px;fill:currentColor}
.item.on .item-ico{background:rgba(255,214,128,.14);color:#f2d391;border-color:rgba(255,214,128,.5)}
.item-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-t{font-family:var(--font-d);font-weight:700;font-size:17px;color:var(--chrome-hi);line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.on .item-t{color:var(--white)}
.item-sub{font-family:var(--font-m);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--smoke);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.item-meta{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--smoke);display:flex;flex-wrap:wrap;gap:4px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;border:1px solid var(--line-2);color:var(--chrome)}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.chip.uv{color:var(--uv-soft);border-color:rgba(166,107,255,.5)}
.chip.amber{color:var(--amber);border-color:rgba(217,164,65,.5)}
.chip.nuevo{color:#f2d391;border-color:rgba(255,214,128,.5);font-weight:700}
.chip.nuevo::before{display:none}
.item-err{font-family:var(--font-m);font-size:10.5px;color:var(--amber);letter-spacing:.06em}
.empty{padding:26px;text-align:center;font-family:var(--font-b);font-size:14px;color:var(--smoke);line-height:1.6;border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;font-family:var(--font-m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--chrome);margin-bottom:6px}

/* login: disco quieto a la izquierda en escritorio */
.login-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:22px;align-items:center}
@media (min-width:980px){ .login-cols{grid-template-columns:448px minmax(0,1fr);gap:36px} }
.card{background:linear-gradient(180deg,var(--ink-2),var(--ink-3));border:1px solid var(--line);border-radius:14px;padding:22px}
@media (max-width:979px){ .login-disco{display:none} }
</style>
</head>
<body>

<section id="screen-login" class="screen active">
  <div class="wrap">
    <p class="eyebrow">Zignalez · Colaboradores</p>
    <h1>Material compartido</h1>
    <div class="login-cols">
      <div class="login-disco" id="login-disco" aria-hidden="true"></div>
      <div class="card">
        <p class="muted" style="margin:0 0 16px;font-size:14px">Ingresa con el correo con que Zignalez te dio acceso. Te llega un enlace para entrar.</p>
        <form id="login-form" novalidate>
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" required>
          <button class="btn primary" id="btn-login" type="submit" style="width:100%;margin-top:14px">Enviar enlace</button>
        </form>
        <div class="status hidden" id="login-status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>

<section id="screen-lista" class="screen">
  <div class="wrap">
    <div class="top">
      <div>
        <p class="eyebrow">Zignalez · Colaboradores</p>
        <h1>Lo que te compartieron</h1>
      </div>
      <div>
        <div class="who" id="who"></div>
        <button class="btn sm" id="btn-logout" type="button" style="margin-top:8px">Cerrar sesión</button>
      </div>
    </div>
    <p class="resumen" id="resumen">Cada acceso tiene fecha de vencimiento. Al vencer o ser revocado, deja de aparecer aquí.</p>
    <div class="cols">
      <div class="col-zp" id="col-zp"></div>
      <div class="col-lista">
        <div id="lista" class="lista"><div class="empty">Cargando…</div></div>
        <div class="status hidden" id="lista-status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"
        integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<script src="assets/zp-player.js"></script>
<script type="module" src="assets/productor.js"></script>
</body>
</html>
